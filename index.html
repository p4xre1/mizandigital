        gtag("js",new Date());
        gtag("config",id,{anonymize_ip:true});

        s.async=true;
        s.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(id);
        document.head.appendChild(s);
      }
      if("requestIdleCallback" in window) requestIdleCallback(loadMizanAnalytics,{timeout:2500});
      else window.addEventListener("load",function(){setTimeout(loadMizanAnalytics,1500)},{once:true});
