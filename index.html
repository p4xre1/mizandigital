    <!--
      Theme bootstrap — يجب أن يُنفَّذ قبل أي رسم.
      سابقاً كان <html class="dark"> ثابتاً في المستند، ثم بعد تحميل React
      يقوم useTheme() بتبديله إلى light حسب تفضيل النظام. النتيجة: وميض
      داكن→فاتح على كل زيارة، وإعادة رسم لكل عناصر transition-colors/
      transition-all (رصد Lighthouse منها 49 عنصر «non-composited animation»).
      هذا السكربت يطبّق السمة الصحيحة قبل أول رسم فيختفي الوميض والسبب معه.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mizan_theme");
          var theme = (stored === "light" || stored === "dark")
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
