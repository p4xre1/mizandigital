    <!-- Google Analytics (GA4) Script + Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = gtag;

      // وضع الموافقة الافتراضي من Google: رفض التخزين التحليلي/الإعلاني إلى حين موافقة صريحة من الزائر
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500
      });

      // إن كان الزائر قد وافق مسبقاً (محفوظ في localStorage عبر شريط إشعار الكوكيز)، نُحدّث الموافقة فوراً
      try {
        var storedConsent = window.localStorage.getItem("mizan-cookie-consent");
        if (storedConsent === "granted") {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {}

      window.mizanGaMeasurementId = "%VITE_GA_ID%";
      if (window.mizanGaMeasurementId && !window.mizanGaMeasurementId.startsWith("%")) {
        gtag("js", new Date());
        gtag("config", window.mizanGaMeasurementId, { anonymize_ip: true });
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + window.mizanGaMeasurementId;
        document.head.appendChild(gaScript);
      }
    </script>
