    <!-- Google Analytics: initialize only when configured and after the first paint. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag("consent","default",{analytics_storage:"denied",wait_for_update:500});

      function loadMizanAnalytics(){
        if(window.__mizanAnalyticsLoaded) return;
        window.__mizanAnalyticsLoaded = true;
        try {
          if(window.localStorage.getItem("mizan-cookie-consent")==="granted") {
            gtag("consent","update",{analytics_storage:"granted"});
          }
        } catch(e) {}
        var id="%VITE_GA_ID%";
        if(!id || id.indexOf("%")===0) return;
        gtag("js",new Date());
        gtag("config",id,{anonymize_ip:true});
        var s=document.createElement("script");
        s.async=true;
        s.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(id);
        document.head.appendChild(s);
      }
      if("requestIdleCallback" in window) requestIdleCallback(loadMizanAnalytics,{timeout:2500});
      else window.addEventListener("load",function(){setTimeout(loadMizanAnalytics,1500)},{once:true});
    </script>
