name: geo-audit

on:
  pull_request:

jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # كان ينادي scripts/generate-llms-txt.mjs — اسم لم يوجد في المستودع
      # يوماً. السكربت الفعلي هو generate-llms.mjs.
      - run: pnpm seo:llms
