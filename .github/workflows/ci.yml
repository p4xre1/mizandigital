name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # كان مثبّتاً على 9 بينما قفل الاعتماديات يتطلب إصداراً أحدث،
          # فكان `pnpm install --frozen-lockfile` يفشل قبل الوصول إلى typecheck.
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
