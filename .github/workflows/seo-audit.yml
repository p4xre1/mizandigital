name: seo-audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # generate-sitemap.mjs يستورد @supabase/supabase-js في أعلى الملف، فبلا
      # تثبيت الاعتماديات يفشل الاستيراد قبل الوصول إلى أي منطق في السكربت.
      - run: node scripts/generate-sitemap.mjs
      - run: node scripts/generate-feed.mjs
