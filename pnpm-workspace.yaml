# pnpm-workspace.yaml

# 1. Register workspace packages so PNPM tracks apps/ and packages/
packages:
  - 'apps/*'
  - 'packages/*'
  - '.'

# 2. Configure cross-platform compilation & binary target overrides
supportedArchitectures:
  os:
    - linux
    - current # Allows local development on macOS/Windows laptops
  cpu:
    - x64
    - arm64
    - current # Ensures local dev environments pull native binaries
  libc:
    - glibc
    - current # Automatically matches your local system's C library (e.g., musl or macOS Libc)