# pnpm-workspace.yaml

# 1. Register workspace packages so PNPM tracks packages/ and root app
packages:
  - 'apps/*'
  - 'packages/*'
  - '.'

# 2. Allow post-install build scripts for native performance tools
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true

# 3. Configure cross-platform compilation & binary target overrides
supportedArchitectures:
  os:
    - linux
    - current
  cpu:
    - x64
    - arm64
    - current
  libc:
    - glibc
    - current
