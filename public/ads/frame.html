<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>إعلان</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #ad-root {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="ad-root"></div>
<script>
  (function () {
    "use strict";

    // هاد الصفحة معزولة قصد: كتشتغل بلا CSP صارمة باش شبكة Adsterra
    // تقدر تدير الطلبات/الـ redirects ديالها (اللي كتبدل الدومين ديالها
    // بشكل متكرر) بلا ما تأثر على سياسة الأمان ديال باقي الموقع.
    // شوف public/_headers للقاعدة الخاصة بهاد المسار.

    var params = new URLSearchParams(window.location.search);
    var variant = params.get("variant");
    var scriptSrc = params.get("scriptSrc");
    var root = document.getElementById("ad-root");

    if (!scriptSrc || !root) return;

    var normalizedSrc = scriptSrc.indexOf("//") === 0 ? "https:" + scriptSrc : scriptSrc;

    if (variant === "banner") {
      var key = params.get("key");
      var width = parseInt(params.get("width"), 10) || 300;
      var height = parseInt(params.get("height"), 10) || 250;
      var format = params.get("format") || "iframe";
      if (key) {
        var optionsScript = document.createElement("script");
        optionsScript.type = "text/javascript";
        optionsScript.text =
          "atOptions = " +
          JSON.stringify({ key: key, format: format, height: height, width: width, params: {} }) +
          ";";
        root.appendChild(optionsScript);
      }
    } else if (variant === "native") {
      var containerId = params.get("containerId");
      if (containerId) {
        var container = document.createElement("div");
        container.id = containerId;
        root.appendChild(container);
      }
    } else if (variant === "popunder") {
      // سكريبتات الـ Popunder فـ الغالب محتاجة تراقب نقرات الصفحة كاملة
      // باش تخدم بشكل طبيعي. هاد المسار (/ads/frame.html) من نفس دومين
      // الموقع (معزول فقط بقاعدة CSP فـ public/_headers، وليس iframe
      // عابر للدومين)، والـ sandbox فوق فيه "allow-same-origin"، فـ
      // window.parent كيبقى فـ متناول الإطار. كنمرر أول نقرة وقعت فـ
      // الصفحة الحقيقية لهاد الإطار المعزول، حتى أي سكريبت Popunder
      // عادي (كيتنصت على document.body هنا) يحس بالنقرة ويخدم بشكل طبيعي.
      try {
        var forwardFirstClick = function () {
          try {
            document.body.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
          } catch (innerErr) {
            /* تجاهل — بعض السكريبتات كتقرا الحدث مباشرة بلا حاجة لهاد التمرير */
          }
          window.parent.document.removeEventListener("click", forwardFirstClick, true);
        };
        window.parent.document.addEventListener("click", forwardFirstClick, true);
      } catch (crossOriginErr) {
        // إيلا تصادف الصفحة تتحمل فـ سياق مختلف (preview بدومين آخر مثلاً)
        // نتجاهلو بهدوء بدل ما نكسرو الصفحة كاملة.
      }
    }

    var adScript = document.createElement("script");
    adScript.type = "text/javascript";
    adScript.src = normalizedSrc;
    adScript.async = true;
    if (variant === "native") {
      adScript.setAttribute("data-cfasync", "false");
    }
    root.appendChild(adScript);
  })();
</script>
</body>
</html>
