<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>إعلان</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #ad-root {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="ad-root"></div>
<script>
  (function () {
    "use strict";

    // هاد الصفحة معزولة قصد: كتشتغل بلا CSP صارمة باش شبكة Adsterra
    // تقدر تدير الطلبات/الـ redirects ديالها (اللي كتبدل الدومين ديالها
    // بشكل متكرر) بلا ما تأثر على سياسة الأمان ديال باقي الموقع.
    // شوف public/_headers للقاعدة الخاصة بهاد المسار.

    var params = new URLSearchParams(window.location.search);
    var variant = params.get("variant");
    var scriptSrc = params.get("scriptSrc");
    var root = document.getElementById("ad-root");

    if (!scriptSrc || !root) return;

    var normalizedSrc = scriptSrc.indexOf("//") === 0 ? "https:" + scriptSrc : scriptSrc;

    if (variant === "banner") {
      var key = params.get("key");
      var width = parseInt(params.get("width"), 10) || 300;
      var height = parseInt(params.get("height"), 10) || 250;
      var format = params.get("format") || "iframe";
      if (key) {
        var optionsScript = document.createElement("script");
        optionsScript.type = "text/javascript";
        optionsScript.text =
          "atOptions = " +
          JSON.stringify({ key: key, format: format, height: height, width: width, params: {} }) +
          ";";
        root.appendChild(optionsScript);
      }
    } else if (variant === "native") {
      var containerId = params.get("containerId");
      if (containerId) {
        var container = document.createElement("div");
        container.id = containerId;
        root.appendChild(container);
      }
    }
    // "popunder" و"socialbar": ما محتاجين أي atOptions ولا حاوية —
    // غير سكريبت واحد كيتحمل مرة وحدة (كيدبّر الـ popup/الشريط بروحو).

    var adScript = document.createElement("script");
    adScript.type = "text/javascript";
    adScript.src = normalizedSrc;
    adScript.async = true;
    if (variant === "native") {
      adScript.setAttribute("data-cfasync", "false");
    }
    root.appendChild(adScript);
  })();
</script>
</body>
</html>
